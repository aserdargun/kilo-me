[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# This project is a bundle of self-contained PEP 723 scripts, not an importable
# Python package. Setuptools' flat-layout autodiscovery would otherwise try to
# package every top-level dir (images/, mcp_servers/, …) and choke on the mix.
[tool.setuptools]
packages = []

[project]
name = "kilo-me"
version = "0.3.0"
description = "Kilo Code agentic stack on OpenRouter — Chinese-default with Western-frontier on demand, persistent SQLite + Chroma + Kuzu graph memory, global config + uv inline scripts"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }

# Runtime dependencies live in each script's PEP 723 metadata block, NOT here.
# This `dependencies` list is intentionally empty — the project itself is a
# bundle of self-contained scripts, not a Python package you import from.
dependencies = []

[project.optional-dependencies]
# `uv pip install -e ".[dev]"` for working on the stack
dev = [
  "fastmcp>=0.4.0",
  "httpx>=0.27.0",
  "chromadb>=0.5.0",
  "sentence-transformers>=2.7.0",
  "kuzu>=0.4.0",
  "pytest>=8.0",
  "pytest-mock>=3.12",
  "mypy>=1.10",
  "ruff>=0.6",
]

[tool.pytest.ini_options]
addopts = "-q --import-mode=importlib"
testpaths = ["mcp_servers", "tests"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["mcp_servers", "scripts"]
ignore_missing_imports = true
# Every MCP server is named `server.py` (and has its own conftest.py) — they
# load via importlib.util.spec_from_file_location, not as packages. Tell
# mypy to treat each directory as its own package base so basename collisions
# don't error out.
explicit_package_bases = true
namespace_packages = true
# Tests and conftests use the same fixture-loading trick; skip them in mypy.
exclude = ["conftest\\.py$", "test_.*\\.py$"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF"]
ignore = ["E501"]

# uv configuration
[tool.uv]
# (Add uv-specific settings here if needed; dev deps live in
# [project.optional-dependencies] above and are installed via
# `uv pip install -e ".[dev]"`)
